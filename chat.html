<script>
"use strict";
// ------------------------------------------------------------- graph access
const NODES = {}, BY = {}, OUT = {};
(GRAPH_DATA ? GRAPH_DATA.nodes : []).forEach(n => {
  NODES[n.id] = n;
  (BY[n.type] = BY[n.type] || []).push(n);
});
(GRAPH_DATA ? GRAPH_DATA.edges : []).forEach(e => {
  const k = e.from + "|" + e.type;
  (OUT[k] = OUT[k] || []).push(e);
});
const sources = pid => (OUT[pid + "|RECOMMENDED_BY"] || []).slice().sort(
  (a, b) => ((a.properties.rank == null) - (b.properties.rank == null)) ||
            ((a.properties.rank || 0) - (b.properties.rank || 0)));
const targets = (pid, t) => (OUT[pid + "|" + t] || []).map(e => NODES[e.to]).filter(Boolean);
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const link = u => u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>` : "";

function fmtPlace(p, filter) {
  const pr = p.properties;
  let loc = [pr.city, pr.state].filter(Boolean).join(", ");
  let out = `- ${pr.name} - ${pr.site || pr.city || ""}` + (loc ? ` (${loc}${pr.region ? ", " + pr.region : ""})` : "") + "\n";
  sources(p.id).forEach(e => {
    if (filter && !filter(e)) return;
    const ep = e.properties, rp = (NODES[e.to] || {}).properties || {};
    const rank = ep.rank ? ` - ranked #${ep.rank}` : "";
    const bf = ep.best_for ? `Best for ${ep.best_for}: ` : "";
    out += `  ${bf}${ep.recommendation || ""}${rank}\n`;
    out += `  Source: "${rp.title || ep.reel_title || "Reel"}" by ${rp.creator || ep.creator || ""} - ${link(rp.url)}\n`;
  });
  return out;
}

const noMatch = what =>
  `I don't have ${what} in the Reel Places graph yet - nothing in the reels added so far covers it, and I only answer from what's in the graph.`;

// ------------------------------------------------------------- vocab
const GENERIC = new Set(["national","park","preserve","and","the","of","recreation","area","monument","state","forest","historical","site"]);
const THEME_SYN = [[/sunrises?\b/,"Sunrise"],[/sunsets?\b/,"Sunset"],[/waterfalls?\b/,"Waterfall"],[/\bfalls\b/,"Waterfall"],
  [/short hikes?\b/,"Short hike"],[/hikes?\b|hiking\b/,"Hike"],[/magic|filmed/,"Filmed location"],[/solitude/,"Solitude"],
  [/bucket list/,"Bucket list"],[/winter/,"Winter visit"],[/wildlife/,"Wildlife"],[/must[- ]see/,"Must-see spot"],
  [/top national parks?\b/,"Top national park"],[/views?\b/,"View"]];
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

function findThemes(q) {
  const found = [];
  for (const [pat, name] of THEME_SYN) {
    if (pat.test(q) && NODES["theme:" + slug(name)] && !found.includes(name)) found.push(name);
  }
  return found;
}
function findSites(q) {
  const words = new Set(q.match(/[a-z']+/g) || []);
  return (BY.Site || []).filter(s => {
    const name = s.properties.name.toLowerCase();
    return q.includes(name) || name.split(/[^a-z']+/).some(w => w.length > 2 && !GENERIC.has(w) && words.has(w));
  });
}
function findGeo(q, raw) {
  // Longest names first, on word boundaries: "West" must not match inside
  // "Southwest", nor "Virginia" inside "West Virginia".
  const byLen = arr => (arr || []).slice().sort((a, b) => b.properties.name.length - a.properties.name.length);
  const mentioned = n => {
    const name = n.properties.name.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return new RegExp(`(?<![a-z])${name}(?![a-z])`).test(q);
  };
  for (const s of byLen(BY.State)) if (mentioned(s)) return ["state", s];
  const m = raw.match(/\b([A-Z]{2})\b/);
  if (m) for (const s of BY.State || []) if ((s.properties.state_code || "").toUpperCase() === m[1]) return ["state", s];
  for (const r of byLen(BY.Region)) if (mentioned(r)) return ["region", r];
  for (const c of byLen(BY.Country)) if (mentioned(c)) return ["country", c];
  return [null, null];
}
const inGeo = (pr, kind, node) => !kind ? true :
  kind === "state" ? pr.state === node.properties.name :
  kind === "region" ? pr.region === node.properties.name :
  pr.country === node.properties.name;

// ------------------------------------------------------------- intents
function ansCount() {
  const places = BY.Place || [], reels = BY.Reel || [], creators = BY.Creator || [];
  let out = `The graph currently holds ${places.length} places from ${reels.length} reels by ${creators.length} creators.\n`;
  const byR = {};
  places.forEach(p => { const r = p.properties.region || "Unknown"; byR[r] = (byR[r] || 0) + 1; });
  Object.entries(byR).sort((a, b) => b[1] - a[1]).forEach(([r, n]) => { out += `- ${r}: ${n}\n`; });
  out += `(${(GRAPH_DATA.nodes || []).length} nodes and ${(GRAPH_DATA.edges || []).length} edges in total.)`;
  return out;
}
function ansReels() {
  const reels = (BY.Reel || []).slice().sort((a, b) => (a.properties.title || "").localeCompare(b.properties.title || ""));
  if (!reels.length) return noMatch("any reels");
  let out = `${reels.length} reels in the graph:\n`;
  reels.forEach(r => { const rp = r.properties;
    out += `- "${rp.title}" by ${rp.creator} - theme: ${rp.theme || "n/a"}, ${rp.places_count || "?"} place(s)\n  ${link(rp.url)}\n`; });
  return out;
}
function ansCreator(q, raw) {
  const m = raw.match(/@[A-Za-z0-9._]+/);
  const handle = m ? m[0].toLowerCase() : null;
  const creator = (BY.Creator || []).find(c =>
    handle ? c.properties.handle.toLowerCase() === handle
           : q.includes(c.properties.handle.replace("@", "").toLowerCase()));
  if (!creator) {
    return "I can't find that creator in the graph. Creators so far: " +
      (BY.Creator || []).map(c => c.properties.handle).join(", ") + ".";
  }
  const h = creator.properties.handle;
  const hits = (BY.Place || []).filter(p => sources(p.id).some(e => e.properties.creator === h));
  if (!hits.length) return noMatch(`any recommendations from ${h}`);
  let out = `${h} recommended ${hits.length} place(s) in the graph:\n`;
  hits.forEach(p => { out += fmtPlace(p, e => e.properties.creator === h); });
  return out;
}
function ansTheme(q, raw) {
  const themes = findThemes(q);
  if (!themes.length) return null;
  const [kind, geo] = findGeo(q, raw);
  const sites = findSites(q);
  const blocks = [];
  for (const theme of themes) {
    const hits = (BY.Place || []).filter(p => {
      const tn = targets(p.id, "BEST_FOR").map(t => t.properties.name);
      if (!tn.includes(theme)) return false;
      if (kind && !inGeo(p.properties, kind, geo)) return false;
      if (sites.length && !sites.some(s => s.properties.name === p.properties.site)) return false;
      return true;
    });
    const scope = kind ? ` in ${geo.properties.name}` :
      sites.length ? " in " + sites.map(s => s.properties.name).join(", ") : "";
    if (!hits.length) { blocks.push(noMatch(`any ${theme.toLowerCase()} spots${scope}`)); continue; }
    hits.sort((a, b) => {
      const ra = Math.min(...sources(a.id).map(e => e.properties.rank || 99));
      const rb = Math.min(...sources(b.id).map(e => e.properties.rank || 99));
      return ra - rb || a.properties.name.localeCompare(b.properties.name);
    });
    let out = `${hits.length} ${theme.toLowerCase()} spot(s)${scope}:\n`;
    hits.forEach(p => { out += fmtPlace(p); });
    blocks.push(out);
  }
  return blocks.join("\n");
}
function ansBrowse(q, raw) {
  const sites = findSites(q);
  const [kind, geo] = findGeo(q, raw);
  if (sites.length) {
    const names = sites.map(s => s.properties.name);
    const hits = (BY.Place || []).filter(p => names.includes(p.properties.site));
    if (!hits.length) return noMatch(`any places in ${names.join(", ")}`);
    let out = `${hits.length} place(s) in ${names.join(", ")}:\n`;
    hits.sort((a, b) => a.properties.name.localeCompare(b.properties.name)).forEach(p => { out += fmtPlace(p); });
    return out;
  }
  if (kind) {
    const hits = (BY.Place || []).filter(p => inGeo(p.properties, kind, geo));
    if (!hits.length) return noMatch(`any places in ${geo.properties.name}`);
    let out = `${hits.length} place(s) in ${geo.properties.name}:\n`;
    hits.sort((a, b) => a.properties.name.localeCompare(b.properties.name)).forEach(p => { out += fmtPlace(p); });
    return out;
  }
  return null;
}
const hav = (a, b) => {
  const R = 6371, r = Math.PI / 180;
  const h = Math.sin((b[0] - a[0]) * r / 2) ** 2 +
    Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin((b[1] - a[1]) * r / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
const MAXDAY = 4;
function ansItinerary(q, raw) {
  const m = q.match(/(\d+)\s*[- ]?\s*days?\b/);
  let days = m ? parseInt(m[1]) : (q.includes("weekend") ? 2 : (q.includes("road trip") ? 3 : 2));
  days = Math.max(1, Math.min(days, 14));
  const sites = findSites(q);
  const [kind, geo] = findGeo(q, raw);
  let pool, scope;
  if (sites.length) {
    const names = sites.map(s => s.properties.name);
    pool = (BY.Place || []).filter(p => names.includes(p.properties.site));
    scope = names.join(" and ");
  } else if (kind) {
    pool = (BY.Place || []).filter(p => inGeo(p.properties, kind, geo));
    scope = geo.properties.name;
  } else {
    pool = (BY.Place || []).slice();
    scope = "all Reel Places";
  }
  pool = pool.filter(p => p.properties.lat != null);
  if (!pool.length) return noMatch(`any places for an itinerary in ${scope}`);
  const bySite = {};
  pool.forEach(p => { const k = p.properties.site || p.properties.city || "Other"; (bySite[k] = bySite[k] || []).push(p); });
  const cent = {};
  Object.entries(bySite).forEach(([s, ps]) => {
    cent[s] = [ps.reduce((a, p) => a + p.properties.lat, 0) / ps.length,
               ps.reduce((a, p) => a + p.properties.lng, 0) / ps.length];
  });
  const rem = new Set(Object.keys(bySite));
  let start = [...rem].sort((a, b) => bySite[b].length - bySite[a].length || a.localeCompare(b))[0];
  const order = [start]; rem.delete(start); let cur = start;
  while (rem.size) {
    const nxt = [...rem].sort((a, b) => hav(cent[cur], cent[a]) - hav(cent[cur], cent[b]))[0];
    order.push(nxt); rem.delete(nxt); cur = nxt;
  }
  const stream = [];
  order.forEach(s => bySite[s].slice().sort((a, b) => a.properties.name.localeCompare(b.properties.name))
    .forEach(p => stream.push(p)));
  let plan = [], day = [];
  for (const s of order) {
    const ps = bySite[s].slice().sort((a, b) => a.properties.name.localeCompare(b.properties.name));
    if (day.length && day.length + ps.length > MAXDAY) { plan.push(day); day = []; }
    for (const p of ps) {
      if (day.length >= MAXDAY) { plan.push(day); day = []; }
      day.push(p);
    }
  }
  if (day.length) plan.push(day);
  let overflow = [];
  if (plan.length > days) { overflow = plan.slice(days).flat(); plan = plan.slice(0, days); }
  if (plan.length < days && stream.length >= days) {
    const per = Math.ceil(stream.length / days);
    plan = [];
    for (let i = 0; i < stream.length; i += per) plan.push(stream.slice(i, i + per));
  }
  const slotOf = p => {
    const tn = targets(p.id, "BEST_FOR").map(t => t.properties.name);
    const bf = (p.properties.best_for || "").toLowerCase();
    if (tn.includes("Sunrise") || bf.includes("sunrise")) return 0;
    if (tn.includes("Sunset") || bf.includes("sunset")) return 2;
    return 1;
  };
  const slotName = ["Morning (sunrise pick)", "Daytime", "Evening (sunset pick)"];
  let out = `${plan.length}-day itinerary - ${scope} (${pool.length} place(s) from the reels, grouped by park and ordered by proximity):\n`;
  plan.forEach((dp, i) => {
    const ds = [...new Set(dp.map(p => p.properties.site || p.properties.city || ""))].filter(Boolean);
    out += `\nDay ${i + 1} - ${ds.join(", ")}\n`;
    dp.slice().sort((a, b) => slotOf(a) - slotOf(b) || a.properties.name.localeCompare(b.properties.name)).forEach(p => {
      const e = sources(p.id)[0], ep = e.properties, rp = (NODES[e.to] || {}).properties || {};
      out += `  [${slotName[slotOf(p)]}] ${p.properties.name} (${p.properties.site || ""})\n`;
      if (ep.recommendation) out += `    ${ep.recommendation}\n`;
      out += `    Source: "${rp.title || ep.reel_title || "Reel"}" by ${rp.creator || ep.creator || ""} - ${link(rp.url)}\n`;
    });
  });
  if (overflow.length) {
    out += `\nNot fitted into ${days} day(s) at ${MAXDAY} stops/day (${overflow.length} more place(s) in scope - add a day or ask for a longer itinerary):\n`;
    overflow.forEach(p => {
      const e = sources(p.id)[0], rp = (NODES[e.to] || {}).properties || {};
      out += `  - ${p.properties.name} (${p.properties.site || ""})\n`;
      out += `    Source: "${rp.title || e.properties.reel_title || "Reel"}" by ${rp.creator || e.properties.creator || ""} - ${link(rp.url)}\n`;
    });
  }
  if (plan.length < days) out += `\n(Only ${pool.length} place(s) are in the graph for this scope, so the plan uses ${plan.length} day(s) rather than ${days}.)`;
  return out;
}

function answer(question) {
  const q = " " + question.toLowerCase().replace(/\s+/g, " ").trim() + " ";
  const raw = question;
  let r = null;
  if (/how many|count|total/.test(q)) r = ansCount();
  else if (/itinerar|road trip|\d+\s*[- ]?\s*days?\b|weekend|plan (a|my|the)/.test(q)) r = ansItinerary(q, raw);
  else if (q.includes("reel") && /list|what|show|all/.test(q)) r = ansReels();
  else if (raw.includes("@")) r = ansCreator(q, raw);
  if (r == null) r = ansTheme(q, raw);
  if (r == null) r = ansBrowse(q, raw);
  if (r == null && (q.includes("recommend") || q.includes(" by "))) r = ansCreator(q, raw);
  if (r == null) r = "I can only answer from the Reel Places graph. Try things like:\n" +
    '- "best sunrise spots" or "best waterfall spots"\n' +
    '- "what did @amorywild recommend?"\n' +
    '- "what\'s recommended in Zion National Park?"\n' +
    '- "places in California" / "places in the Southwest"\n' +
    '- "list reels" / "how many places do we have?"\n' +
    '- "make a 2-day itinerary for Utah"';
  return r;
}

// ------------------------------------------------------------- UI
const log = document.getElementById("log");
function add(text, cls, html) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  if (html) d.innerHTML = text; else d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
const EXAMPLES = ["best sunrise spots", "make a 2-day itinerary for Utah",
  "best waterfall spots", "places in California",
  "what did @amorywild recommend?", "how many places do we have?", "list reels"];
const chips = document.getElementById("chips");
EXAMPLES.forEach(ex => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = ex;
  b.onclick = () => ask(ex);
  chips.appendChild(b);
});
function ask(text) {
  add(esc(text), "user");
  add(answer(text), "bot", true);
}
document.getElementById("f").addEventListener("submit", ev => {
  ev.preventDefault();
  const inp = document.getElementById("q");
  const v = inp.value.trim();
  if (!v) return;
  inp.value = "";
  ask(v);
});
